<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>偽ピヴォ パターン集</title>
<style>
  :root{
    --bg:#FAFAF7; --court:#EEF3EA; --line:#B9C4B4; --ink:#2B2F2C; --muted:#6E756F;
    --atk:#2F6F73; --def:#B5654A; --space:#E9C46A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;line-height:1.6}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 32px}
  h1{font-size:18px;font-weight:600;margin:0 0 10px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .tabs button{flex:1 1 auto}
  h2{font-size:16px;font-weight:600;margin:0 0 2px}
  .sub{font-size:13px;color:var(--muted);margin:0 0 10px}
  svg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:6px;background:var(--court)}
  .caption{min-height:3.2em;margin:12px 0 10px;font-size:15px;padding-left:12px;border-left:3px solid var(--atk)}
  .caption b{font-weight:600}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  button{font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;cursor:pointer}
  button:hover{border-color:var(--atk)}
  button:focus-visible{outline:2px solid var(--atk);outline-offset:2px}
  button.primary{background:var(--atk);color:#fff;border-color:var(--atk)}
  button.on{border-color:var(--atk);color:var(--atk);font-weight:600}
  .tabs button.on{background:#E4EEEE}
  .legend{display:flex;gap:16px;margin-top:14px;font-size:12px;color:var(--muted)}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
  .legend .a::before{background:var(--atk)} .legend .d::before{background:var(--def)}
  .legend .s::before{background:var(--space);border-radius:2px}
  text{font-family:inherit}
</style>
</head>

  // ---------- エンジン ----------
  const NS='http://www.w3.org/2000/svg';
  const $=id=>document.getElementById(id);
  const ease=t=>t<.5?2*t*t:-1+(4-2*t)*t;
  const fade=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));
  function pos(f,t){
    if(t<=f[0][0]) return [f[0][1],f[0][2]];
    for(let i=1;i<f.length;i++) if(t<=f[i][0]){
      const a=f[i-1],b=f[i],u=ease((t-a[0])/(b[0]-a[0]));
      return [a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u];
    }
    const l=f[f.length-1]; return [l[1],l[2]];
  }
  function mk(tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}

  let cur, t=0, playing=false, last=null, nodes={}, ovs=[];
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function load(i){
    cur=PATTERNS[i]; t=0; playing=false; last=null;
    $('title').textContent=cur.title; $('sub').textContent=cur.sub;
    document.querySelectorAll('#tabs button').forEach((b,j)=>b.classList.toggle('on',j===i));
    const pl=$('players'); pl.innerHTML=''; nodes={};
    for(const id in cur.players){
      const [lab,x,y]=cur.players[id];
      const isGK=id==='GK', atk=id in ATK;
      const g=mk('g',{});
      g.appendChild(mk('circle',{r:isGK?11:12,fill:isGK?'#8A8F8B':atk?'var(--atk)':'var(--def)'}));
      const tx=mk('text',{y:4,'text-anchor':'middle','font-size':10,fill:'#fff'}); tx.textContent=lab; g.appendChild(tx);
      pl.appendChild(g); nodes[id]=g;
      if(!cur.K[id]) cur.K[id]=[[0,x,y]];
    }
    const ov=$('overlays'); ov.innerHTML=''; ovs=[];
    for(const o of cur.overlays){
      const a=o.arrow?{fill:'none',stroke:'var(--atk)','stroke-width':2,'stroke-dasharray':'5 5',...o.attrs}:o.attrs;
      const e=mk(o.tag,a); if(o.text) e.textContent=o.text;
      ov.appendChild(e); ovs.push({e,o});
    }
    const c=$('controls'); c.querySelectorAll('[data-t]').forEach(b=>b.remove());
    for(const [s,lab] of cur.caps){
      const b=document.createElement('button'); b.dataset.t=s; b.textContent=lab;
      b.addEventListener('click',()=>{playing=false;$('play').textContent='再生';t=s;render();});
      c.appendChild(b);
    }
    $('play').textContent='再生';
    render();
  }

  function render(){
    for(const id in nodes){const [x,y]=pos(cur.K[id],t);nodes[id].setAttribute('transform',`translate(${x},${y})`);}
    const [bx,by]=pos(cur.K.ball,t); $('ball').setAttribute('cx',bx); $('ball').setAttribute('cy',by);
    for(const {e,o} of ovs) e.setAttribute('opacity',(o.op||1)*fade(t,o.in[0],o.in[1])*(1-fade(t,o.out[0],o.out[1])));
    let html=cur.caps[0][2]; for(const c of cur.caps) if(t>=c[0]) html=c[2];
    $('caption').innerHTML=html;
    document.querySelectorAll('#controls [data-t]').forEach(b=>{
      const s=+b.dataset.t, nx=cur.caps.find(c=>c[0]>s);
      b.classList.toggle('on',t>=s&&(!nx||t<nx[0]));
    });
  }
  function loop(now){
    if(!playing) return;
    if(last!==null) t+=(now-last)/1000*(reduce?.6:1);
    last=now;
    if(t>=cur.end){t=cur.end;playing=false;$('play').textContent='もう一度';}
    render(); if(playing) requestAnimationFrame(loop);
  }
  $('play').addEventListener('click',()=>{
    if(playing){playing=false;$('play').textContent='再生';return;}
    if(t>=cur.end) t=0;
    playing=true; last=null; $('play').textContent='一時停止'; requestAnimationFrame(loop);
  });
  PATTERNS.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p.tab;b.addEventListener('click',()=>load(i));$('tabs').appendChild(b);});
  load(0);
})();
